<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Noxware Development </title>
  <link rel="icon" href="logo.png">
  <!-- Poppins Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <!-- VIDEO BACKGROUND -->
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="back.mp4" type="video/mp4" />
  </video>

  <div class="overlay"></div>
  <div class="grain"></div>

  <!-- SOUND ICON -->
  <div id="sound-icon"><i class="fas fa-volume-up"></i></div>

  <!-- CORNER DECO -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- MAIN CONTENT -->
  <div class="content">

    <div class="logo-wrap">
      <img src="logo.png" alt="Logo"
           onerror="this.style.display='none'; document.querySelector('.logo-text-fallback').style.display='block'"/>
      <div class="logo-text-fallback" style="display:none;">NOXWARE DEVELOPMENT</div>
    </div>

    <p class="eyebrow">Sizler İçin Titizlikle Hazırlanıyor...</p>

    <h1 class="headline">Cok Yakında</h1>

    <p class="subtext">Yeni Projeler İnşa Ediyoruz. Çok Yakında Burada Olacak ;)</p>

    <div class="divider"></div>

    <p class="hint">&#9654;&nbsp; Sesi Açmak İçin Ekrana Dokun.</p>

  </div>

  <script>
    const video     = document.getElementById('bg-video');
    const soundIcon = document.getElementById('sound-icon');
    let muted = true;

    function spawnRipple(x, y) {
      const size = 80;
      const el = document.createElement('div');
      el.classList.add('ripple');
      el.style.width  = size + 'px';
      el.style.height = size + 'px';
      el.style.left   = (x - size / 2) + 'px';
      el.style.top    = (y - size / 2) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 850);
    }

    document.body.addEventListener('click', function(e) {
      spawnRipple(e.clientX, e.clientY);

      muted = !muted;
      video.muted = muted;

      if (!muted) {
        // Ensure playback (browsers may block audio until first interaction)
        video.play().catch(() => {});
        soundIcon.classList.add('visible');
      } else {
        soundIcon.classList.remove('visible');
      }
    });
  </script>
</body>
</html>


  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    :root {
      --red-deep:   #8b0000;
      --red-mid:    #c0392b;
      --red-bright: #e74c3c;
      --red-hot:    #ff2d2d;
      --dark-bg:    #0a0000;
      --dark-card:  rgba(20, 0, 0, 0.6);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: var(--dark-bg);
      cursor: pointer;
    }

    /* ── VIDEO BACKGROUND ── */
    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: brightness(0.55) saturate(1.4);
    }

    /* ── OVERLAY ── */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(ellipse at 50% 100%, rgba(231, 7, 7, 0.144) 0%, transparent 65%),
        radial-gradient(ellipse at 50% 0%,   rgba(0, 0, 0, 0.199)    0%, transparent 70%);
      pointer-events: none;
    }

    /* ── NOISE GRAIN ── */
    .grain {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.06;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px 180px;
    }

    /* ── SOUND ICON (top-left) ── */
    #sound-icon {
      position: fixed;
      top: 28px; left: 32px;
      z-index: 100;
      font-size: 1.5rem;
      color: #fff;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      text-shadow: 0 0 18px rgba(231,76,60,0.9), 0 0 40px rgba(231,76,60,0.4);
      pointer-events: none;
    }

    #sound-icon.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* pulse ring when sound is on */
    #sound-icon.visible::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 46px; height: 46px;
      border: 1.5px solid rgba(231,76,60,0.55);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: ring 1.8s ease-out infinite;
    }

    @keyframes ring {
      0%   { transform: translate(-50%,-50%) scale(0.6); opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(1.7); opacity: 0; }
    }

    /* ── MAIN CONTENT ── */
    .content {
      position: relative;
      z-index: 10;
      width: 100%; height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      text-align: center;
      padding: 2rem;
    }

    /* LOGO */
    .logo-wrap {
      margin-bottom: 2.2rem;
      animation: fadeDown 1.1s cubic-bezier(.22,1,.36,1) both;
    }

    .logo-wrap img {
      height: 72px;
      object-fit: contain;
      filter: drop-shadow(0 0 24px rgba(231,76,60,0.7));
    }

    /* fallback when logo.png missing */
    .logo-wrap .logo-text-fallback {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: .12em;
      background: linear-gradient(135deg, var(--red-hot), #fff 60%, var(--red-mid));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-transform: uppercase;
    }

    /* EYEBROW */
    .eyebrow {
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: var(--red-bright);
      margin-bottom: 1rem;
      animation: fadeUp 1s .2s cubic-bezier(.22,1,.36,1) both;
      opacity: .85;
    }

    /* HEADLINE */
    .headline {
      font-size: clamp(3.5rem, 10vw, 8rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -.02em;
      background: linear-gradient(
        135deg,
        #fff       0%,
        var(--red-bright) 35%,
        var(--red-deep)   65%,
        #fff       100%
      );
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation:
        fadeUp      1s   .35s cubic-bezier(.22,1,.36,1) both,
        gradShift   6s   2s   ease-in-out infinite alternate;
    }

    @keyframes gradShift {
      0%   { background-position: 0%   50%; }
      100% { background-position: 100% 50%; }
    }

    /* SUBTEXT */
    .subtext {
      margin-top: 1.4rem;
      font-size: clamp(.9rem, 2vw, 1.1rem);
      font-weight: 300;
      letter-spacing: .04em;
      background: linear-gradient(90deg, rgba(255,255,255,.55), rgba(231,76,60,.8), rgba(255,255,255,.55));
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation:
        fadeUp   1s   .5s  cubic-bezier(.22,1,.36,1) both,
        shimmer  4s   2.5s linear infinite;
    }

    @keyframes shimmer {
      to { background-position: 200% center; }
    }

    /* DIVIDER */
    .divider {
      width: 80px; height: 2px;
      margin: 2rem auto 0;
      background: linear-gradient(90deg, transparent, var(--red-bright), var(--red-hot), var(--red-bright), transparent);
      border-radius: 2px;
      animation: fadeUp 1s .65s cubic-bezier(.22,1,.36,1) both;
    }

    /* HINT (click to unmute) */
    .hint {
      margin-top: 1.6rem;
      font-size: .72rem;
      font-weight: 400;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(255,255,255,.3);
      animation: fadeUp 1s .8s cubic-bezier(.22,1,.36,1) both, blink 3s 3s ease-in-out infinite;
    }

    @keyframes blink {
      0%,100% { opacity: .3; }
      50%      { opacity: .7; }
    }

    /* CORNER DECORATIONS */
    .corner {
      position: fixed;
      width: 60px; height: 60px;
      border-color: rgba(231,76,60,.35);
      border-style: solid;
      z-index: 10;
      pointer-events: none;
    }
    .corner.tl { top: 20px; left: 20px;  border-width: 1.5px 0 0 1.5px; }
    .corner.tr { top: 20px; right: 20px; border-width: 1.5px 1.5px 0 0; }
    .corner.bl { bottom: 20px; left: 20px;  border-width: 0 0 1.5px 1.5px; }
    .corner.br { bottom: 20px; right: 20px; border-width: 0 1.5px 1.5px 0; }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(28px); }
      to   { opacity:1; transform: translateY(0); }
    }
    @keyframes fadeDown {
      from { opacity:0; transform: translateY(-20px); }
      to   { opacity:1; transform: translateY(0); }
    }

    /* RIPPLE on click */
    .ripple {
      position: fixed;
      border-radius: 50%;
      transform: scale(0);
      border: 1.5px solid rgba(231,76,60,0.5);
      pointer-events: none;
      z-index: 5;
      animation: rippleAnim .8s ease-out forwards;
    }

    @keyframes rippleAnim {
      to { transform: scale(6); opacity: 0; }
    }
  </style>
